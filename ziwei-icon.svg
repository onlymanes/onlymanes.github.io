<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="zg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#fffbe8"/>
      <stop offset="35%" stop-color="#ffe98a"/>
      <stop offset="70%" stop-color="#f2c14e"/>
      <stop offset="100%" stop-color="#c1912f"/>
    </radialGradient>
    <linearGradient id="zring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="50%" stop-color="#ffe98a"/>
      <stop offset="100%" stop-color="#d9ab3c"/>
    </linearGradient>
    <filter id="zglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- outer orbit ring -->
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#zring)" stroke-opacity=".85" stroke-width="1.4"/>
  <!-- inner dotted orbit ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#f6d365" stroke-opacity=".75" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="0.1 3.4"/>
  <!-- sparkle on the ring, top -->
  <polygon points="32,0.4 32.9,2.6 35.1,3.5 32.9,4.4 32,6.6 31.1,4.4 28.9,3.5 31.1,2.6" fill="#fff3c4"/>
  <!-- faceted gold star -->
  <g filter="url(#zglow)">
    <polygon points="32,10 37.29,24.72 52.92,25.2 40.56,34.78 44.93,49.8 32,41 19.07,49.8 23.44,34.78 11.08,25.2 26.71,24.72" fill="url(#zg)" stroke="#8a6414" stroke-opacity=".65" stroke-width=".9" stroke-linejoin="round"/>
    <!-- facet seams: centre to inner vertices -->
    <g stroke="#8a6414" stroke-opacity=".38" stroke-width=".7">
      <line x1="32" y1="32" x2="37.29" y2="24.72"/>
      <line x1="32" y1="32" x2="40.56" y2="34.78"/>
      <line x1="32" y1="32" x2="32" y2="41"/>
      <line x1="32" y1="32" x2="23.44" y2="34.78"/>
      <line x1="32" y1="32" x2="26.71" y2="24.72"/>
    </g>
    <!-- bright core -->
    <circle cx="32" cy="32" r="2.4" fill="#fffbe8"/>
  </g>
  <!-- lavender star-dust (the purple note) -->
  <circle cx="52.5" cy="12" r="1.4" fill="#e6dcff"/>
  <circle cx="10.5" cy="46" r="1.2" fill="#cdbcf5"/>
</svg>
