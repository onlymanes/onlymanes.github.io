<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}onlymanes Blog</title>

    <link rel="stylesheet" href="/assets/css/extra.css">
    <link rel="icon" href="/assets/img/icons/onlymanes.png" type="image/png">

    <style>
        .content-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        @media (min-width: 992px) {
            .main-layout {
                display: flex;
                align-items: center;
            }
        }

        @media (max-width: 991px) {
            .cover-wrapper {
                margin: 0 auto !important;
                margin-left: 0 !important;
                width: 100%;
                height: auto;
                aspect-ratio: 600/399;
            }
            .watermark-circle {
                width: 40px;
                height: 40px;
                font-size: 8px;
            }
        }

        .cover-wrapper {
            position: sticky;
            top: calc(45vh - 200px);
            width: 600px;
            height: 399px;
            margin-left: 50px;
        }

        .cover-image {
            width: 100%;
            height: 100%;
            /* image set dynamically; keeps JS free to swap without 404 */
            background-position: center;
            background-size: cover;
            border-radius: 20px;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.3));
        }

        .watermark-circle {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: rgba(1, 248, 63, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: rgb(84, 3, 113);
            font-size: 12px;
            text-align: center;
            line-height: 1.2;
            border: 2px solid #00B4D8;
        }

        @media (max-width: 767px) {}

        .post-nav-top { margin-bottom: 1.2rem; font-size: 0.95rem; }
        .post-nav-bottom {
            margin-top: 2.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0, 170, 255, 0.25);
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.95rem;
        }
        .post-nav-bottom a { max-width: 48%; }
        .post-nav-bottom .next { margin-left: auto; text-align: right; }

        .post-date { opacity: 0.65; font-size: 0.85em; margin-right: 0.6em; white-space: nowrap; }
        .post-desc { opacity: 0.65; font-size: 0.9em; margin-left: 0.6em; }

        /* ===== 文章正文排版优化(仅文章页) ===== */
        .is-post .text-section { overflow-wrap: break-word; }
        .is-post .text-section p { line-height: 1.9; margin: 0 0 1.1em; text-align: justify; }
        /* 首段为标题行,次段为时间戳行(老文章无 front matter,正文即标题+时间戳开头) */
        .is-post .text-section > p:first-of-type {
            font-size: 1.5em; font-weight: 700; line-height: 1.4;
            margin-bottom: 0.25em; text-align: left;
        }
        .is-post .text-section > p:nth-of-type(2) {
            opacity: 0.55; font-size: 0.85em; margin-bottom: 2em; text-align: left;
        }
        .is-post .text-section h1, .is-post .text-section h2,
        .is-post .text-section h3, .is-post .text-section h4 {
            line-height: 1.5; margin: 1.6em 0 0.8em;
        }
        /* 图片:自适应缩放、圆角、居中、阴影 */
        .is-post .text-section img {
            max-width: 100%; height: auto; display: block;
            margin: 1.2rem auto; border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        }
        /* 视频:圆角 */
        .is-post .text-section video {
            max-width: 100%; border-radius: 12px; display: block; margin: 1.2rem auto;
        }
        /* 音频:限宽播放条 */
        .is-post .text-section audio {
            width: 100%; max-width: 420px; display: block; margin: 1.2rem 0;
        }
        /* 灯箱:点击图片全屏查看 */
        .lightbox {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(0, 0, 0, 0.92);
            display: flex; align-items: center; justify-content: center;
            cursor: zoom-out;
        }
        .lightbox img { max-width: 94vw; max-height: 94vh; border-radius: 8px; }
    </style>
</head>

<body{% if page.date %} class="is-post"{% endif %}>
    <div class="content-container">
        <div class="main-layout">
            <div class="text-section">
                {% if page.date %}
                <nav class="post-nav-top">
                    <a href="/">&larr; 返回主页</a>
                </nav>
                {% endif %}
                {{ content }}
                {% if page.date %}
                <nav class="post-nav-bottom">
                    {% if page.previous %}
                    <a href="{{ page.previous.url }}">&larr; {{ page.previous.title }}</a>
                    {% endif %}
                    {% if page.next %}
                    <a class="next" href="{{ page.next.url }}">{{ page.next.title }} &rarr;</a>
                    {% endif %}
                </nav>
                {% endif %}
            </div>

            <div class="cover-wrapper">
                <div class="cover-image"></div>
                <div class="watermark-circle">only<br>manes</div>
            </div>
        </div>
    </div>

    {% include footer.html %}

    <script>
        (function () {
            const TOTAL_IMAGES = 30;
            const randomIndex = Math.floor(Math.random() * TOTAL_IMAGES) + 1;
            const imgUrl = `/assets/img/cover/${randomIndex}.jpg`;

            document.addEventListener('DOMContentLoaded', function () {
                document.querySelectorAll('.cover-image').forEach(function (el) {
                    el.style.backgroundImage = `url('${imgUrl}')`;
                });

                const og = document.querySelector('meta[property="og:image"]');
                if (og) og.setAttribute('content', imgUrl);
            });
        })();
    </script>

    {% if page.date %}
    <script>
        // 文章页图片:懒加载 + 点击灯箱放大
        (function () {
            function enableLightbox(img) {
                img.addEventListener('click', function () {
                    var lb = document.createElement('div');
                    lb.className = 'lightbox';
                    var full = document.createElement('img');
                    full.src = img.src;
                    full.alt = img.alt || '';
                    lb.appendChild(full);
                    lb.addEventListener('click', function () { lb.remove(); });
                    document.addEventListener('keydown', function esc(e) {
                        if (e.key === 'Escape') {
                            lb.remove();
                            document.removeEventListener('keydown', esc);
                        }
                    });
                    document.body.appendChild(lb);
                });
            }
            document.addEventListener('DOMContentLoaded', function () {
                document.querySelectorAll('.text-section img').forEach(function (img) {
                    img.loading = 'lazy';
                    img.decoding = 'async';
                    img.style.cursor = 'zoom-in';
                    enableLightbox(img);
                });
            });
        })();
    </script>
    {% endif %}
</body>

</html>
