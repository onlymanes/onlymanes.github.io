<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}onlymanes Blog</title>

    <link rel="stylesheet" href="/assets/css/extra.css">
    <link rel="icon" href="/assets/img/icons/onlymanes.png" type="image/png">

    <style>
        .content-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        @media (min-width: 992px) {
            .main-layout {
                display: flex;
                align-items: center;
            }
        }

        @media (max-width: 991px) {
            .cover-wrapper {
                margin: 0 auto !important;
                margin-left: 0 !important;
                width: 100%;
                height: auto;
                aspect-ratio: 600/399;
            }
            .watermark-circle {
                width: 40px;
                height: 40px;
                font-size: 8px;
            }
        }

        .cover-wrapper {
            position: sticky;
            top: calc(45vh - 200px);
            width: 600px;
            height: 399px;
            margin-left: 50px;
        }

        .cover-image {
            width: 100%;
            height: 100%;
            /* image set dynamically; keeps JS free to swap without 404 */
            background-position: center;
            background-size: cover;
            border-radius: 20px;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.3));
        }

        .watermark-circle {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: rgba(1, 248, 63, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: rgb(84, 3, 113);
            font-size: 12px;
            text-align: center;
            line-height: 1.2;
            border: 2px solid #00B4D8;
        }

        @media (max-width: 767px) {}

        .post-nav-top { margin-bottom: 1.2rem; font-size: 0.95rem; }
        .post-nav-bottom {
            margin-top: 2.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0, 170, 255, 0.25);
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.95rem;
        }
        .post-nav-bottom a { max-width: 48%; }
        .post-nav-bottom .next { margin-left: auto; text-align: right; }

        .post-date { opacity: 0.65; font-size: 0.85em; margin-right: 0.6em; white-space: nowrap; }
        .post-desc { opacity: 0.65; font-size: 0.9em; margin-left: 0.6em; }
    </style>
</head>

<body>
    <div class="content-container">
        <div class="main-layout">
            <div class="text-section">
                {% if page.date %}
                <nav class="post-nav-top">
                    <a href="/">&larr; 返回主页</a>
                </nav>
                {% endif %}
                {{ content }}
                {% if page.date %}
                <nav class="post-nav-bottom">
                    {% if page.previous %}
                    <a href="{{ page.previous.url }}">&larr; {{ page.previous.title }}</a>
                    {% endif %}
                    {% if page.next %}
                    <a class="next" href="{{ page.next.url }}">{{ page.next.title }} &rarr;</a>
                    {% endif %}
                </nav>
                {% endif %}
            </div>

            <div class="cover-wrapper">
                <div class="cover-image"></div>
                <div class="watermark-circle">only<br>manes</div>
            </div>
        </div>
    </div>

    {% include footer.html %}

    <script>
        (function () {
            const TOTAL_IMAGES = 30;
            const randomIndex = Math.floor(Math.random() * TOTAL_IMAGES) + 1;
            const imgUrl = `/assets/img/cover/${randomIndex}.jpg`;

            document.addEventListener('DOMContentLoaded', function () {
                document.querySelectorAll('.cover-image').forEach(function (el) {
                    el.style.backgroundImage = `url('${imgUrl}')`;
                });

                const og = document.querySelector('meta[property="og:image"]');
                if (og) og.setAttribute('content', imgUrl);
            });
        })();
    </script>
</body>

</html>
