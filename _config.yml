title: onlymanes Blog
description: Personal blog sharing creative ideas
baseurl: /
url: https://onlymanes.ai
permalink: /blog/:year/:month/:day/:title.html

plugins:
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - node_modules
  - Gemfile.lock
  - vendor

# 让 Jekyll 把 _redirects 原样拷到输出目录（_redirects 以 _ 开头，默认会被排除）
include:
  - _redirects

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
